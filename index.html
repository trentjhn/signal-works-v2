<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary meta -->
    <title>SignalWorks. Automation that actually gets built.</title>
    <meta name="description" content="Your AI department, sized to how you want to work. We build, deploy, and maintain custom AI systems for small businesses, founder-led brands, and agencies." />
    <meta name="theme-color" content="#0a051e" />
    <link rel="canonical" href="https://www.signalworks.live/" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, Slack, Discord, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SignalWorks" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.signalworks.live/" />
    <meta property="og:title" content="SignalWorks. Automation that actually gets built." />
    <meta property="og:description" content="Your AI department, sized to how you want to work. We build, deploy, and maintain custom AI systems for small businesses, founder-led brands, and agencies." />
    <meta property="og:image" content="https://www.signalworks.live/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SignalWorks. Automation that actually gets built." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SignalWorks. Automation that actually gets built." />
    <meta name="twitter:description" content="Your AI department, sized to how you want to work. We build, deploy, and maintain custom AI systems for small businesses, founder-led brands, and agencies." />
    <meta name="twitter:image" content="https://www.signalworks.live/og-image.png" />

    <!-- Structured data (JSON-LD): Organization + WebSite + service catalog. Gives Google and
         AI engines a verifiable, machine-readable description of the entity. sameAs,
         disambiguatingDescription, and knowsAbout exist specifically to separate this SignalWorks
         (the custom-AI engineering agency at signalworks.live) from same-named companies in
         marketing, architecture, gaming, and workplace consulting. Service descriptions are kept
         verbatim from the visible "What we build" section so the markup matches on-page content.
         Bump dateModified on content changes; add LinkedIn / Crunchbase / Wikidata to sameAs as
         those profiles are created (highest-leverage entity-disambiguation work, currently off-site). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.signalworks.live/#organization",
          "name": "SignalWorks",
          "url": "https://www.signalworks.live/",
          "slogan": "Automation that actually gets built.",
          "description": "Your AI department, sized to how you want to work. SignalWorks builds, deploys, and maintains custom AI systems for small businesses, founder-led brands, and agencies.",
          "disambiguatingDescription": "A custom-AI engineering agency for small businesses, founder-led brands, and agencies. Distinct from other companies named SignalWorks in marketing, architecture, gaming, and workplace consulting.",
          "email": "hello@signalworks.live",
          "image": "https://www.signalworks.live/og-image.png",
          "logo": "https://www.signalworks.live/og-image.png",
          "sameAs": [
            "https://github.com/signalworks-hq"
          ],
          "knowsAbout": [
            "Artificial intelligence automation",
            "Custom AI software development",
            "AI agents",
            "Retrieval-augmented generation",
            "Knowledge management systems",
            "Answer engine optimization",
            "AI search visibility",
            "AI security and governance"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "hello@signalworks.live",
            "contactType": "sales",
            "availableLanguage": "English"
          },
          "founder": [
            { "@type": "Person", "name": "Trenton Johnson", "jobTitle": "Co-founder", "alumniOf": "Yale University" },
            { "@type": "Person", "name": "Jahleel Heath", "jobTitle": "Co-founder" }
          ],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "SignalWorks services",
            "itemListElement": [
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "AI Automations",
                  "description": "Background workflows that run quietly and produce structured output. Lead-gen pipelines, document generation, intent classification, content drafting, and meeting-to-action wiring.",
                  "provider": { "@id": "https://www.signalworks.live/#organization" }
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "AI Tooling Setup",
                  "description": "Custom GPTs, tool and data integrations, agents, prompt libraries, and team training. For teams that already have AI tools but aren't getting full value out of them.",
                  "provider": { "@id": "https://www.signalworks.live/#organization" }
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "Knowledge Systems",
                  "description": "Your scattered docs, Slack, and drives turned into one searchable brain your team can just ask. Permission-aware, so the right people see the right answers, and nothing leaks.",
                  "provider": { "@id": "https://www.signalworks.live/#organization" }
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "Intelligence Systems & Custom Software",
                  "description": "Multi-source monitoring with full dashboards. Governance trackers, competitive intelligence, custom agentic systems with backend integration, and bespoke web applications built around your specific workflow.",
                  "provider": { "@id": "https://www.signalworks.live/#organization" }
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "AI Security & Governance",
                  "description": "Security assessments of existing AI deployments. Vendor and contract audits. Internal AI usage policies. Compliance mapping for the regulations that apply to your industry.",
                  "provider": { "@id": "https://www.signalworks.live/#organization" }
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Service",
                  "name": "AI Search Visibility (AEO)",
                  "description": "Answer engine optimization: measure whether your brand comes up in AI search for category queries, with a visibility baseline and mention-rate tracking across engines.",
                  "provider": { "@id": "https://www.signalworks.live/#organization" }
                }
              }
            ]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.signalworks.live/#website",
          "name": "SignalWorks",
          "url": "https://www.signalworks.live/",
          "inLanguage": "en-US",
          "publisher": { "@id": "https://www.signalworks.live/#organization" },
          "dateModified": "2026-05-31"
        }
      ]
    }
    </script>

    <!-- Preconnect to font CDNs and WebGL CDN so they start downloading before the parser reaches the actual <link>/<script> tags -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body class="bg-[#0a051e] text-white min-h-screen w-full selection:bg-purple-500 selection:text-white relative overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

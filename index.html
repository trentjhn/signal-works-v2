<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a051e" />

    <!-- Open Graph / Twitter image + card are shared across pages; the page-specific
         title/description/url and JSON-LD are injected per route by prerender.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SignalWorks" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://www.signalworks.live/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SignalWorks. Automation that actually gets built." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.signalworks.live/og-image.png" />

    <!-- Per-route SEO: <title>, description, canonical, og/twitter title+description+url,
         and JSON-LD. Injected from src/seo.js by prerender.js. On the dev server (which
         serves this template raw) the per-page tags are absent; that is fine for local dev. -->
    <!--SEO-->

    <!-- Preconnect to font CDNs and WebGL CDN so they start downloading before the parser reaches the actual <link>/<script> tags -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body class="bg-[#0a051e] text-white min-h-screen w-full selection:bg-purple-500 selection:text-white relative overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
